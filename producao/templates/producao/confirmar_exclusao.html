<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .danger-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border-top: 5px solid #dc3545;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="danger-box">
        <i class="fas fa-exclamation-triangle text-danger fa-4x mb-4"></i>

        <h3 class="text-danger fw-bold">Excluir Pedido #{{ pedido.id }}?</h3>

        <p class="text-muted mt-3">
            Cliente: <strong>{{ pedido.cliente.nome }}</strong><br>
            Valor: <strong>R$ {{ pedido.valor_total }}</strong>
        </p>

        <div class="alert alert-warning small">
            <i class="fas fa-info-circle"></i> Atenção: Se este pedido já tiver gerado financeiro ou baixa de estoque, a exclusão pode ser bloqueada pelo sistema.
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-danger btn-lg shadow-sm">
                    <i class="fas fa-trash-alt"></i> CONFIRMAR EXCLUSÃO
                </button>
                <a href="{% url 'lista_pedidos' %}" class="btn btn-outline-secondary">
                    Cancelar e Voltar
                </a>
            </div>
        </form>
    </div>

</body>
</html>
