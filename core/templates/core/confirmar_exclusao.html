<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; min-height: 100vh; }
        .danger-box { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; text-align: center; border-top: 5px solid #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <div class="danger-box shadow">
            <i class="fas fa-exclamation-triangle text-danger fa-3x mb-3"></i>
            <h3 class="text-danger">Tem certeza?</h3>
            <p class="text-muted">Você está prestes a excluir o cliente:<br><strong>{{ cliente.nome }}</strong></p>
            <p class="small text-secondary">Essa ação não pode ser desfeita.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-grid gap-2 mt-4">
                    <button type="submit" class="btn btn-danger btn-lg">
                        <i class="fas fa-trash"></i> SIM, EXCLUIR
                    </button>
                    <a href="{% url 'lista_clientes' %}" class="btn btn-outline-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
